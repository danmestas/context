on: [push, landing]
jobs:
  test:
    timeout-minutes: 30
    steps:
      - run: make test
      - run: make sanitize
      - run: make fuzz-ci
      - run: python3 bench/check_corpus.py
      - run: bash -n bench/run.sh
      - run: python3 -c "import sqlite3; sqlite3.connect(':memory:').executescript(open('bench/schema.sql').read())"
      - run: |
          sqlite3 :memory: -bail -cmd '.read schema/state.sql' -cmd '.read schema/index.sql' '.read schema/check.sql'
